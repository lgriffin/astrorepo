name: CI

# One run per change (specs/045-developer-experience, DEV-008): pull requests run on pull_request
# and main runs on push, and a newer push to the same pull request cancels the run it replaces.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every gate once, side by side, as `npm run verify` runs them on a desktop (DEV-005, DEV-009).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - run: npm run build

  # Windows is where AstroRepo runs: the tests and the build again there. Lint and the type checks
  # read the same source on every platform, so they run once, above.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Every page in every theme in a real browser: errors, blank pages, accessibility findings
  # beyond the baseline (DEV-011 to DEV-014). The screenshots are kept for review.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke
      # The same pages over the demo library, where they have something to show (DEV-017).
      - run: npm run demo
      - run: npm run smoke -- --demo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke
          path: |
            reports/smoke/
            reports/smoke-demo/
          if-no-files-found: ignore
